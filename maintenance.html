<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0c0c1d 0%, #1a1a3e 50%, #0f0f2a 100%);
            overflow: hidden;
            padding: 20px;
        }

        /* Анимированный фон — плавающие круги */
        .bg-circles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            animation: float 20s infinite ease-in-out;
        }

        .circle:nth-child(1) {
            width: 400px;
            height: 400px;
            background: #6c5ce7;
            top: -10%;
            left: -5%;
            animation-delay: 0s;
            animation-duration: 22s;
        }

        .circle:nth-child(2) {
            width: 350px;
            height: 350px;
            background: #00b4d8;
            bottom: -12%;
            right: -8%;
            animation-delay: -7s;
            animation-duration: 26s;
        }

        .circle:nth-child(3) {
            width: 280px;
            height: 280px;
            background: #e84393;
            top: 50%;
            left: 60%;
            animation-delay: -13s;
            animation-duration: 24s;
            opacity: 0.25;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(40px, -50px) scale(1.08);
            }
            50% {
                transform: translate(-30px, 30px) scale(0.95);
            }
            75% {
                transform: translate(25px, 45px) scale(1.05);
            }
        }

        /* Основной контент */
        .wrapper {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 620px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
            animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Анимированная иконка — шестерёнки/шестерёнка */
        .icon-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 35px;
            position: relative;
        }

        .gear {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: spin 6s linear infinite;
        }

        .gear svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: url(#grad);
            stroke-width: 3;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Пульсирующее кольцо вокруг иконки */
        .pulse-ring {
            position: absolute;
            inset: -15px;
            border-radius: 50%;
            border: 2px solid rgba(108, 92, 231, 0.3);
            animation: pulse 2.5s ease-out infinite;
        }

        .pulse-ring:nth-child(2) {
            animation-delay: 1.25s;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.85);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* Текст */
        h1 {
            font-size: clamp(1.6rem, 4vw, 2.1rem);
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 18px;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        h1 .accent {
            background: linear-gradient(90deg, #a29bfe, #74b9ff, #a29bfe);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        .description {
            font-size: 1.05rem;
            line-height: 1.75;
            color: rgba(255, 255, 255, 0.68);
            margin-bottom: 40px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Прогресс-бар "обновления" */
        .progress-wrap {
            width: 100%;
            max-width: 340px;
            margin: 0 auto 36px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 40%;
            border-radius: 100px;
            background: linear-gradient(90deg, #6c5ce7, #00b4d8, #6c5ce7);
            background-size: 200% 100%;
            animation: progressMove 2.4s ease-in-out infinite, gradientShift 3s linear infinite;
        }

        @keyframes progressMove {
            0% { transform: translateX(-120%); }
            100% { transform: translateX(360%); }
        }

        @keyframes gradientShift {
            to { background-position: 200% center; }
        }

        /* Точки загрузки */
        .dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #a29bfe;
            animation: dotBounce 1.4s ease-in-out infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
            background: #74b9ff;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
            background: #00b4d8;
        }

        @keyframes dotBounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            40% {
                transform: translateY(-12px);
                opacity: 1;
            }
        }

        /* Футер-подпись */
        .footer-note {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .footer-note svg {
            width: 16px;
            height: 16px;
            stroke: rgba(255, 255, 255, 0.35);
            animation: pulseIcon 2s ease-in-out infinite;
        }

        @keyframes pulseIcon {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .wrapper {
                padding: 40px 24px;
            }
            .icon-container {
                width: 90px;
                height: 90px;
            }
            .description {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <!-- Анимированный фон -->
    <div class="bg-circles">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Контент -->
    <div class="wrapper">
        <!-- SVG-градиент для иконки -->
        <svg width="0" height="0" style="position:absolute">
            <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#a29bfe" />
                    <stop offset="50%" stop-color="#74b9ff" />
                    <stop offset="100%" stop-color="#00b4d8" />
                </linearGradient>
            </defs>
        </svg>

        <!-- Иконка с анимацией -->
        <div class="icon-container">
            <div class="pulse-ring"></div>
            <div class="pulse-ring"></div>
            <div class="gear">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" stroke="url(#grad)" stroke-width="1.5"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
            </div>
        </div>

        <h1>Ведутся <span class="accent">технические работы</span></h1>

        <p class="description">
            Мы обновляем сервис, повышаем его стабильность и безопасность.
            Пожалуйста, зайдите чуть позже — мы скоро вернёмся!
        </p>

        <!-- Прогресс-бар -->
        <div class="progress-wrap">
            <div class="progress-bar"></div>
        </div>

        <!-- Точки загрузки -->
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="footer-note">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>Спасибо за ваше терпение</span>
        </div>
    </div>

</body>
</html>
