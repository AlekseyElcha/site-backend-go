events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log debug;

    limit_req_zone $binary_remote_addr zone=one_limit:50m rate=20r/m;

    upstream go_backend {
        server site-backend-app:8080;
    }

    # HTTP -> HTTPS, 301
    server {
        listen 80;
        server_name domofon-servis-odi.ru ask.domofon-servis-odi.ru;
        return 301 https://$host$request_uri;
    }

    # Основной сайт (domofon-servis-odi.ru)
    server {
        listen 443 ssl;
        server_name domofon-servis-odi.ru;

        ssl_certificate /etc/letsencrypt/live/domofon-servis-odi.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/domofon-servis-odi.ru/privkey.pem;

        # 0 - сайт работает, 1 - включить заглушку обслуживания
        set $maintenance 0;

        if ($maintenance = 1) {
            rewrite ^ /maintenance.html last;
        }

        root /usr/share/nginx/html/main-site;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

 
        location = /maintenance.html {
            root /usr/share/nginx/html/main-site;
        }
    }

    # Поддомен ask.domofon-servis-odi.ru
    server {
        listen 443 ssl;
        server_name ask.domofon-servis-odi.ru;

        ssl_certificate /etc/letsencrypt/live/domofon-servis-odi.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/domofon-servis-odi.ru/privkey.pem;

        # 0 - бэкенд работает, 1 - включить заглушку обслуживания
        set $maintenance 1;
        
        if ($maintenance = 1) {
            rewrite ^ /maintenance.html last;
        }

        client_max_body_size 20M;

        location = /maintenance.html {
            root /usr/share/nginx/html/main-site;
        }

        location / {
            limit_req zone=one_limit burst=5 nodelay;

            proxy_pass http://go_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
