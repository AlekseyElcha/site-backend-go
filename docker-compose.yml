services:
  url-shortener-postgres:
    image: postgres:18.6-bookworm
    container_name: site-backend-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    restart: always
volumes:
  pg_data: