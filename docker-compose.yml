services:
  site-backend-postgres:
    image: postgres:18.6-bookworm
    container_name: site-backend-postgres
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - PGDATA=/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app-network

  site-backend-redis:
    image: redis:7-alpine
    container_name: site-backend-redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - app-network

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    ports:
      - "5540:5540"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pg_data:
